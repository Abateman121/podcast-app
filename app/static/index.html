<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<title>Podcasts</title>
<style>
:root{--bg:#eef0f2;--card:#fff;--ink:#15181c;--mute:#667080;--line:#d9dde2;--acc:#e8700c;--accink:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1c2027;--ink:#e9ecef;--mute:#8b94a1;--line:#2a2f38;--acc:#ff8a2b;--accink:#14171c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:165px}
header{position:sticky;top:0;background:var(--bg);padding:max(12px,env(safe-area-inset-top)) 16px 0;z-index:5}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;color:var(--mute);font:inherit;font-weight:600;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--acc)}
main{max-width:760px;margin:0 auto;padding:12px 16px}
.row{display:flex;gap:12px;align-items:center;padding:12px;background:var(--card);border-bottom:1px solid var(--line);cursor:pointer}
.row img,.ph{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--line);flex:none}
.row .t{font-weight:600}.row .s{color:var(--mute);font-size:14px}
.row.played .t{color:var(--mute)}
.bar{display:flex;gap:8px;margin:10px 0}
input,select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:0}
input[type=text],input[type=url]{flex:1}
button.p{background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
button.g{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.empty{color:var(--mute);padding:28px 4px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(420px,92vw)}
dialog label{display:block;margin:10px 0 4px;font-size:14px;color:var(--mute)}
dialog input,dialog select{width:100%}
#player{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px max(10px,env(safe-area-inset-bottom))}
#player .in{max-width:760px;margin:0 auto}
#now{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{color:var(--mute);font-size:13px;height:18px}
#ver{text-align:right;font-size:11px;color:var(--mute);margin-top:2px;font-variant-numeric:tabular-nums}
#seek{width:100%;accent-color:var(--acc);margin:6px 0}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.skipbar{align-items:center;flex-wrap:wrap}.skipbar label{font-size:14px;color:var(--mute)}.skipbar input{width:80px}
.ctl button{min-width:44px;min-height:40px}
#play{background:var(--acc);color:var(--accink);border:0;border-radius:50%;width:48px;height:48px;font-size:20px;cursor:pointer}
.tm{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.pb{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.pb>i{display:block;height:100%;background:var(--acc);width:0}
.pb.ind>i{width:35%;animation:slide 1.2s ease-in-out infinite alternate}
@keyframes slide{from{margin-left:0}to{margin-left:65%}}
@media(prefers-reduced-motion:reduce){.pb.ind>i{animation:none;margin-left:30%}}
.msg{color:var(--mute);font-size:14px;margin:6px 0;min-height:20px}
.msg.bad{color:#c0392b}
.qrow{padding:12px;background:var(--card);border-bottom:1px solid var(--line)}
.qrow .t{font-weight:600}.qrow .s{color:var(--mute);font-size:14px}
.qrow .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
dialog.wide{width:min(560px,94vw)}
.mrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}
.mrow .lab{flex:1 1 100%;font-size:14px;color:var(--mute);margin-top:8px}
.mrow input{width:100px}
.mrow button{padding:6px 10px;font:inherit;cursor:pointer}
.lst .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.lst .it button{padding:4px 8px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<header><nav id="tabs">
  <button data-t="pl" class="on">Playlists</button><button data-t="sh">Shows</button><button data-t="qu">Queue</button>
</nav></header>
<main id="main"></main>

<dialog id="dlg"><form method="dialog" id="plform">
  <h3 style="margin:0 0 4px">New smart playlist</h3>
  <label>Name</label><input id="pn" required>
  <label>Shows (none selected means all)</label><select id="ps" multiple size="4"></select>
  <label>Max length (minutes, optional)</label><input id="pm" type="number" min="1">
  <label>Only from the last (days, optional)</label><input id="pd" type="number" min="1">
  <label>Order</label><select id="po"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select>
  <label><input id="pu" type="checkbox" checked style="width:auto"> Unplayed only</label>
  <div class="bar" style="justify-content:flex-end"><button class="g" value="cancel">Cancel</button><button class="p" value="ok">Save playlist</button></div>
</form></dialog>

<dialog id="iodlg" class="wide"><form method="dialog">
  <h3 style="margin:0 0 4px">Set intro/outro</h3>
  <div class="msg" id="iostat"></div>
  <label>Reference episode (any downloaded episode of this show)</label><select id="ioep"></select>
  <audio id="ioau" controls preload="auto" style="width:100%;margin-top:8px"></audio>
  <div id="iorows"></div>
  <div class="msg" id="iomsg"></div>
  <div class="bar" style="flex-wrap:wrap"><button type="button" class="g" id="iodi">Delete intro template</button><button type="button" class="g" id="iodo">Delete outro template</button></div>
  <div class="bar" style="justify-content:flex-end"><button class="g" value="cancel">Close</button><button type="button" class="p" id="iosave">Save templates</button></div>
</form></dialog>

<dialog id="addlg" class="wide"><form method="dialog">
  <h3 style="margin:0 0 4px">Tag an ad</h3>
  <div class="msg" id="adinfo"></div>
  <div class="mrow"><span class="lab">Missed ad starts at (m:ss)</span>
    <input id="adstart" type="text" inputmode="decimal" placeholder="1:23">
    <button type="button" class="g" data-f="adstart" data-a="now">Now</button><button type="button" class="g" data-f="adstart" data-a="-5">&minus;5s</button><button type="button" class="g" data-f="adstart" data-a="5">+5s</button><button type="button" class="g" data-f="adstart" data-a="play">Play</button></div>
  <div class="mrow"><span class="lab">and ends at (m:ss)</span>
    <input id="adend" type="text" inputmode="decimal" placeholder="2:05">
    <button type="button" class="g" data-f="adend" data-a="now">Now</button><button type="button" class="g" data-f="adend" data-a="-5">&minus;5s</button><button type="button" class="g" data-f="adend" data-a="5">+5s</button><button type="button" class="g" data-f="adend" data-a="play">Play</button></div>
  <div class="bar"><button type="button" class="p" id="adsave">Save missed ad</button></div>
  <div class="msg" id="admsg"></div>
  <label>Skipped by mistake? Tap Not an ad on the range that was wrongly skipped.</label>
  <div class="lst" id="adranges"></div>
  <label>Your tags in this episode</label>
  <div class="lst" id="adtags"></div>
  <div class="bar" style="justify-content:flex-end"><button class="g" value="cancel">Close</button></div>
</form></dialog>

<div id="player"><div class="in">
  <div id="now">Nothing playing</div><div id="sub"></div>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <div class="ctl">
    <span class="tm" id="cur">0:00</span>
    <button class="g" id="back">-15</button>
    <button id="play">&#9654;</button>
    <button class="g" id="fwd">+30</button>
    <button class="g" id="spddn" title="Slower (0.05x)">&minus;</button><button class="g" id="spd" title="Tap to reset to 1.0x">1.0x</button><button class="g" id="spdup" title="Faster (0.05x)">+</button>
    <button class="g" id="skipad" title="Skip detected ads">Ads: on</button>
    <button class="g" id="skipio" title="Skip intro and outro">Intro/outro: on</button>
    <button class="g" id="tagad" title="Tag a missed ad, or an ad that was skipped by mistake">Tag ad</button>
    <span class="tm" id="rem">0:00</span>
  </div>
  <div id="ver">v0.0.14</div>
</div></div>
<audio id="au" preload="auto"></audio>

<script>
const $ = s => document.querySelector(s);
const au = $('#au');
const loadFlag = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v === '1'; } catch (_) { return d; } };
const saveFlag = (k, v) => { try { localStorage.setItem(k, v ? '1' : '0'); } catch (_) {} };
let queue = [], qi = -1, tab = 'pl', skipAds = loadFlag('skipAds', true), skipIO = loadFlag('skipIO', true), lastSave = 0;
const SPEED_MIN = 0.5, SPEED_MAX = 3, SPEED_STEP = 0.05;
let speed = 1;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
const api = async (url, opt) => { const r = await fetch(url, opt); if (!r.ok) throw new Error(await r.text()); return r.json(); };
const post = (url, body) => api(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {})});

function epRow(e, idx) {
  const mins = e.duration ? Math.round(e.duration/60) + ' min' : '';
  const labels = {queued: 'in download queue', downloading: 'downloading', downloaded: 'waiting to scan', scanning: 'scanning for ads',
    error: 'download failed', scan_error: 'ad scan failed', new: 'not downloaded'};
  const state = e.status === 'ready' ? (e.ads.length ? e.ads.length + ' ad' + (e.ads.length > 1 ? 's' : '') + ' found' : 'no ads found') : (labels[e.status] || e.status);
  const img = e.show_image ? `<img src="${esc(e.show_image)}" alt="">` : '<div class="ph"></div>';
  return `<div class="row ${e.played ? 'played' : ''}" data-i="${idx}">${img}<div><div class="t">${esc(e.title)}</div>
    <div class="s">${esc(e.show_title)} &middot; ${mins} &middot; ${state}</div></div></div>`;
}

async function showPlaylists() {
  const pls = await api('/api/playlists');
  let html = `<div class="bar"><button class="p" id="newpl">New smart playlist</button><button class="g" id="refresh">Check for episodes</button></div>`;
  if (!pls.length) html += `<div class="empty">No playlists yet. Create one with rules like unplayed episodes under 45 minutes.</div>`;
  for (const p of pls) {
    const eps = await api(`/api/playlists/${p.id}/episodes`);
    html += `<h3 style="margin:18px 0 6px">${esc(p.name)} <span class="s" style="font-weight:400;color:var(--mute)">${eps.length} episodes</span>
      <button class="g" data-del="${p.id}" style="float:right">Delete</button></h3>`;
    html += eps.map((e, i) => epRow(e, p.id + ':' + i)).join('') || `<div class="empty">Nothing matches yet.</div>`;
    p.eps = eps;
  }
  $('#main').innerHTML = html;
  window._pl = pls;
  $('#newpl').onclick = openDialog;
  $('#refresh').onclick = () => post('/api/refresh');
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async ev => { ev.stopPropagation();
    if (confirm('Delete this playlist?')) { await api('/api/playlists/' + b.dataset.del, {method:'DELETE'}); render(); } });
  document.querySelectorAll('.row').forEach(r => r.onclick = () => {
    const [pid, i] = r.dataset.i.split(':').map(Number);
    const p = window._pl.find(x => x.id === pid); queue = p.eps; play(i); });
}

async function showShows(showId) {
  if (showId) {
    const eps = await api('/api/episodes?show_id=' + showId);
    const show = (await api('/api/shows')).find(x => x.id === +showId) || {};
    const tplLen = l => l ? l.toFixed(1) + ' s' : 'none';
    let html = `<div class="bar"><button class="g" id="bk">Back to shows</button><button class="g" id="rescan">Re-scan ads</button></div>
      <div class="bar"><button class="g" id="setio">Set intro/outro</button><button class="g" id="redetect">Re-detect intro/outro</button></div>
      <div class="msg">Intro template: ${tplLen(show.intro_template_len)}. Outro template: ${tplLen(show.outro_template_len)}. Episodes with no confident match use the fallback seconds below.</div>
      <div class="bar skipbar"><label>Fallback intro <input id="introsec" type="number" min="0" max="600" value="${show.intro_skip || 0}"> sec</label>
      <label>Fallback outro <input id="outrosec" type="number" min="0" max="600" value="${show.outro_skip || 0}"> sec</label>
      <button class="g" id="saveskip">Save</button></div><div class="msg" id="rmsg"></div><div class="msg" id="lmsg" style="min-height:0"></div>`;
    html += eps.map((e, i) => epRow(e, i)).join('');
    $('#main').innerHTML = html;
    $('#bk').onclick = () => showShows();
    $('#setio').onclick = () => openIoDialog(showId, eps, () => showShows(showId));
    $('#redetect').onclick = async () => { const r = await post(`/api/shows/${showId}/redetect`);
      $('#rmsg').textContent = 'Re-checking intro and outro for ' + r.queued + ' downloaded episodes in the background. This uses the CPU only.'; };
    api(`/api/shows/${showId}/ad-learning`).then(l => { if (l.missed_ads || l.not_ads) {
      $('#lmsg').textContent = 'Learned from your tags: ' + l.missed_ads + ' missed ads (' + l.audio_samples + ' with audio), ' + l.phrases.length + ' phrases.'
        + (l.phrases.length ? ' For example "' + l.phrases.slice(0, 3).join('", "') + '".' : ''); } }).catch(() => {});
    $('#saveskip').onclick = async () => {
      const r = await post(`/api/shows/${showId}/skips`, {intro_skip: +$('#introsec').value || 0, outro_skip: +$('#outrosec').value || 0});
      eps.forEach(x => { x.intro_skip = r.intro_skip; x.outro_skip = r.outro_skip; });
      $('#rmsg').textContent = 'Saved. Intro ' + r.intro_skip + 's, outro ' + r.outro_skip + 's.'; };
    $('#rescan').onclick = async () => { let found = 0, queued = 0;
      for (const e of eps.filter(x => x.playable && x.status !== 'downloaded' && x.status !== 'scanning')) {
        const r = await post(`/api/episodes/${e.id}/rescan`); if (r.mode === 'new scan queued') queued++; else found += r.ads; }
      await showShows(showId);
      $('#rmsg').textContent = queued ? queued + ' episodes queued for a new scan. Watch the Queue tab.' : 'Re-checked with saved transcripts. ' + found + ' ads found in total.'; };
    document.querySelectorAll('.row').forEach(r => r.onclick = async () => {
      const e = eps[+r.dataset.i];
      if (!e.playable) { if (['queued','downloading'].includes(e.status)) { alert('Already in the download queue. Check the Queue tab.'); return; }
        await post(`/api/episodes/${e.id}/download`); alert('Added to the download queue. Watch it on the Queue tab.'); showShows(showId); return; }
      queue = eps; play(+r.dataset.i); });
    return;
  }
  const shows = await api('/api/shows');
  let html = `<div class="bar"><input id="feed" type="text" placeholder="Paste a link: RSS, Apple Podcasts, Spotify, Amazon, or YouTube"><button class="p" id="addf">Add show</button></div>
    <div class="bar"><button class="g" id="opmlbtn">Import OPML file</button><input id="opml" type="file" accept=".opml,.xml,text/xml" hidden></div>
    <div class="msg" id="smsg"></div>`;
  if (!shows.length) html += `<div class="empty">No shows yet. Paste a link above or import an OPML file.</div>`;
  html += shows.map(s => `<div class="row" data-s="${s.id}">${s.image ? `<img src="${esc(s.image)}" alt="">` : '<div class="ph"></div>'}
    <div style="flex:1;min-width:0"><div class="t">${esc(s.title || s.feed_url)}</div></div>
    <button class="g" data-delshow="${s.id}" data-name="${esc(s.title || s.feed_url)}">Delete</button></div>`).join('');
  $('#main').innerHTML = html;
  const say = (m, bad) => { const el = $('#smsg'); el.textContent = m; el.className = 'msg' + (bad ? ' bad' : ''); };
  const addFeed = async () => { const u = $('#feed').value.trim(); if (!u) return;
    say('Adding...'); $('#addf').disabled = true;
    try { const r = await post('/api/shows', {url: u}); await showShows(); $('#smsg').textContent = r.note || ('Added ' + (r.title || 'show') + '.'); }
    catch (e) { say(readErr(e), true); $('#addf').disabled = false; } };
  $('#addf').onclick = addFeed;
  $('#feed').onkeydown = ev => { if (ev.key === 'Enter') addFeed(); };
  $('#opmlbtn').onclick = () => $('#opml').click();
  $('#opml').onchange = async ev => { const f = ev.target.files[0]; if (!f) return; say('Importing...');
    try { const r = await api('/api/import/opml', {method: 'POST', headers: {'Content-Type': 'text/xml'}, body: await f.text()});
      await showShows(); $('#smsg').textContent = 'Imported ' + r.added + ' new shows (' + r.skipped + ' already added). The newest episode of each is queued.'; }
    catch (e) { say(readErr(e), true); } };
  document.querySelectorAll('[data-delshow]').forEach(b => b.onclick = async ev => { ev.stopPropagation();
    if (!confirm('Delete "' + b.dataset.name + '" and its downloaded audio?')) return;
    await api('/api/shows/' + b.dataset.delshow, {method: 'DELETE'}); showShows(); });
  document.querySelectorAll('[data-s]').forEach(r => r.onclick = () => showShows(r.dataset.s));
}

async function openDialog() {
  const shows = await api('/api/shows');
  $('#ps').innerHTML = shows.map(s => `<option value="${s.id}">${esc(s.title || s.feed_url)}</option>`).join('');
  $('#dlg').showModal();
}
$('#plform').addEventListener('submit', async ev => {
  if (ev.submitter && ev.submitter.value === 'cancel') return;
  const rules = { show_ids: [...$('#ps').selectedOptions].map(o => +o.value), unplayed_only: $('#pu').checked, sort: $('#po').value };
  if ($('#pm').value) rules.max_minutes = +$('#pm').value;
  if ($('#pd').value) rules.newer_than_days = +$('#pd').value;
  await post('/api/playlists', {name: $('#pn').value, rules});
  render();
});

const readErr = e => { try { return JSON.parse(e.message).detail || e.message; } catch (_) { return e.message; } };
const mb = b => (b / 1048576).toFixed(b > 10485760 ? 0 : 1) + ' MB';

function drawQueue(q) {
  if (!q.length) { $('#main').innerHTML = '<div class="empty">Nothing in the queue. Episodes appear here while they download and scan.</div>'; return; }
  const names = {queued: 'Waiting to download', downloading: 'Downloading', downloaded: 'Waiting to scan', scanning: 'Scanning for ads',
    error: 'Download failed', scan_error: 'Ad scan failed'};
  $('#main').innerHTML = q.map(x => {
    const bad = x.status === 'error' || x.status === 'scan_error';
    let detail = names[x.status];
    if (x.fraction != null) detail += ' ' + Math.round(x.fraction * 100) + '%';
    if (x.status === 'downloading' && x.total) detail += ' (' + mb(x.done) + ' of ' + mb(x.total) + ')';
    if (x.status === 'downloading' && !x.total && x.done) detail += ' (' + mb(x.done) + ')';
    const active = x.status === 'downloading' || x.status === 'scanning';
    const bar = active ? `<div class="pb ${x.fraction == null ? 'ind' : ''}"><i style="width:${x.fraction == null ? '' : Math.round(x.fraction * 100) + '%'}"></i></div>` : '';
    const retry = bad ? `<button class="g" data-retry="${x.id}">Retry</button>` : '';
    const err = bad && x.error ? `<div class="s">${esc(x.error)}</div>` : '';
    return `<div class="qrow"><div class="top"><div style="min-width:0"><div class="t">${esc(x.title)}</div>
      <div class="s">${esc(x.show_title)} &middot; ${detail}</div></div>${retry}</div>${bar}${err}</div>`;
  }).join('');
  document.querySelectorAll('[data-retry]').forEach(b => b.onclick = async () => { await post('/api/episodes/' + b.dataset.retry + '/retry'); pollQueue(); });
}
async function pollQueue() {
  try {
    const q = await api('/api/queue');
    const busy = q.filter(x => x.status !== 'error' && x.status !== 'scan_error').length;
    document.querySelector('[data-t="qu"]').textContent = busy ? 'Queue (' + busy + ')' : 'Queue';
    if (tab === 'qu') drawQueue(q);
  } catch (e) { /* server restarting, try again next tick */ }
}
function render() { tab === 'pl' ? showPlaylists() : tab === 'sh' ? showShows() : pollQueue(); }
setInterval(pollQueue, 2500);
$('#tabs').onclick = ev => { const b = ev.target.closest('button'); if (!b) return; tab = b.dataset.t;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b)); render(); };

// ---- skip rules (pure functions, no DOM) ----
// Intro to skip: detected markers first, otherwise the show's fixed seconds from the start.
function introRange(e, dur) {
  const m = e.markers || {};
  if (typeof m.intro_end === 'number') return {start: m.intro_start || 0, end: m.intro_end};
  if (e.intro_skip > 0 && e.intro_skip < dur) return {start: 0, end: e.intro_skip};
  return null;
}
// Where the outro starts: detected marker first, otherwise the show's fixed seconds before the end.
function outroStart(e, dur) {
  const m = e.markers || {};
  if (typeof m.outro_start === 'number') return m.outro_start;
  if (e.outro_skip > 0 && dur) return dur - e.outro_skip - 0.5;
  return null;
}
// What to do about the intro at time t. Nothing is skipped before the intro starts (a cold open plays),
// the skip happens once, and seeking back into the intro afterwards does not skip again.
function introAction(e, t, dur, on) {
  if (!on || !dur || e._introDone) return null;
  const r = introRange(e, dur);
  if (!r) return null;
  if (t >= r.end) return {type: 'passed'};
  if (t >= r.start) return {type: 'skip', to: Math.min(r.end, dur)};
  return null;
}
function outroAction(e, t, dur, on) {
  if (!on || !dur || e._outroDone) return null;
  const s = outroStart(e, dur);
  if (s !== null && t >= s) return {type: 'skip', to: dur};
  return null;
}
// ---- end skip rules ----

// ---- player ----
async function play(i) {
  qi = i; const e = queue[i]; if (!e) return;
  try { Object.assign(e, await api('/api/episodes/' + e.id)); } catch (_) { /* play with what we have */ }
  au.src = '/audio/' + e.id;
  au.playbackRate = speed;
  e._outroDone = false; e._introDone = false; e._preview = null;
  au.onloadedmetadata = () => {
    let start = (e.position > 5 && e.position < au.duration - 10) ? e.position : 0;
    const a = introAction(e, start, au.duration, skipIO);
    if (a && a.type === 'skip') { e._introDone = true; start = a.to; toast('Skipped intro'); }
    else if (a) e._introDone = true;
    if (start > 0) au.currentTime = start;
  };
  au.play();
  $('#now').textContent = e.title; $('#sub').textContent = e.show_title;
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({title: e.title, artist: e.show_title, artwork: e.show_image ? [{src: e.show_image}] : []});
    navigator.mediaSession.setActionHandler('play', () => au.play());
    navigator.mediaSession.setActionHandler('pause', () => au.pause());
    navigator.mediaSession.setActionHandler('seekbackward', () => au.currentTime -= 15);
    navigator.mediaSession.setActionHandler('seekforward', () => au.currentTime += 30);
    navigator.mediaSession.setActionHandler('nexttrack', () => play(qi + 1));
  }
}
function save(done) {
  const e = queue[qi]; if (!e || !isFinite(au.currentTime)) return;
  e.position = au.currentTime; if (done) e.played = 1;
  post(`/api/episodes/${e.id}/progress`, {position: au.currentTime, played: !!done}).catch(() => {});
}
let toastT;
function toast(msg) { $('#sub').textContent = msg; clearTimeout(toastT);
  toastT = setTimeout(() => { const e = queue[qi]; if (e) $('#sub').textContent = e.show_title; }, 3000); }

au.ontimeupdate = () => {
  const e = queue[qi]; if (!e) return;
  const oa = outroAction(e, au.currentTime, au.duration, skipIO);
  if (oa) { e._outroDone = true; toast('Skipped outro'); au.currentTime = oa.to; return; }
  const ia = introAction(e, au.currentTime, au.duration, skipIO);
  if (ia && ia.type === 'passed') e._introDone = true;
  else if (ia) { e._introDone = true; toast('Skipped intro'); au.currentTime = ia.to; return; }
  const previewing = e._preview && au.currentTime >= e._preview[0] && au.currentTime <= e._preview[1];
  if (skipAds && !previewing) for (const [s, t] of e.ads) if (au.currentTime >= s && au.currentTime < t - 0.5) {
    au.currentTime = t; toast('Skipped ad (' + Math.round(t - s) + 's)'); break; }
  $('#seek').value = au.duration ? (au.currentTime / au.duration) * 1000 : 0;
  $('#cur').textContent = fmt(au.currentTime);
  $('#rem').textContent = '-' + fmt((au.duration - au.currentTime) / au.playbackRate);
  if (Date.now() - lastSave > 5000) { lastSave = Date.now(); save(false); }
};
au.onplay = () => $('#play').innerHTML = '&#10074;&#10074;';
au.onpause = () => { $('#play').innerHTML = '&#9654;'; save(false); };
au.onended = () => { save(true); if (qi + 1 < queue.length) play(qi + 1); };
$('#play').onclick = () => au.paused ? au.play() : au.pause();
$('#back').onclick = () => au.currentTime -= 15;
$('#fwd').onclick = () => au.currentTime += 30;
$('#seek').oninput = ev => { if (au.duration) au.currentTime = (ev.target.value / 1000) * au.duration; };
const setSpeed = v => {
  speed = Math.min(SPEED_MAX, Math.max(SPEED_MIN, Math.round(v * 100) / 100));   // round to hundredths to avoid float drift
  au.playbackRate = speed;
  $('#spd').textContent = speed.toFixed(2).replace(/0$/, '') + 'x';
};
$('#spddn').onclick = () => setSpeed(speed - SPEED_STEP);
$('#spdup').onclick = () => setSpeed(speed + SPEED_STEP);
$('#spd').onclick = () => setSpeed(1);
const paintToggles = () => { $('#skipad').textContent = 'Ads: ' + (skipAds ? 'on' : 'off'); $('#skipio').textContent = 'Intro/outro: ' + (skipIO ? 'on' : 'off'); };
$('#skipad').onclick = () => { skipAds = !skipAds; saveFlag('skipAds', skipAds); paintToggles(); };
$('#skipio').onclick = () => { skipIO = !skipIO; saveFlag('skipIO', skipIO); paintToggles(); };
paintToggles();
let tick = 0;
setInterval(async () => { const e = queue[qi]; if (!e) return;
  tick++; if (e.status === 'ready' && tick % 6) return;   // every 5s while scanning, every 30s otherwise
  try { const f = await api('/api/episodes/' + e.id); e.ads = f.ads; e.status = f.status; e.markers = f.markers; } catch (_) {} }, 5000);

// ---- intro/outro marking tool (show page) ----
const IO_ROWS = [['intro_start', 'Intro starts at'], ['intro_end', 'Intro ends at'], ['outro_start', 'Outro starts at'], ['outro_end', 'Outro ends at']];
let ioDone = null;
async function openIoDialog(showId, eps, done) {
  const usable = eps.filter(e => e.playable);
  if (!usable.length) { alert('Download an episode of this show first, then mark its intro and outro.'); return; }
  au.pause(); ioDone = done;
  const ioau = $('#ioau');
  const say = (m, bad) => { const el = $('#iomsg'); el.textContent = m; el.className = 'msg' + (bad ? ' bad' : ''); };
  const status = async () => { const s = (await api('/api/shows')).find(x => x.id === +showId) || {};
    const len = l => l ? l.toFixed(1) + ' s' : 'none';
    $('#iostat').textContent = 'Intro template: ' + len(s.intro_template_len) + '. Outro template: ' + len(s.outro_template_len) + '.'; };
  $('#ioep').innerHTML = usable.map(e => `<option value="${e.id}">${esc(e.title)}</option>`).join('');
  ioau.src = '/audio/' + usable[0].id;
  $('#ioep').onchange = () => { ioau.src = '/audio/' + $('#ioep').value; };
  $('#iorows').innerHTML = IO_ROWS.map(([k, label]) => `<div class="mrow"><span class="lab">${label} (seconds)</span>
    <input id="io_${k}" type="number" min="0" step="0.1">
    <button type="button" class="g" data-k="${k}" data-a="now">Now</button>
    <button type="button" class="g" data-k="${k}" data-a="-0.1">&minus;0.1</button>
    <button type="button" class="g" data-k="${k}" data-a="0.1">+0.1</button>
    <button type="button" class="g" data-k="${k}" data-a="play">${k.endsWith('_end') ? 'Play 3s before' : 'Play from here'}</button></div>`).join('');
  $('#iorows').onclick = ev => { const b = ev.target.closest('button'); if (!b) return;
    const f = $('#io_' + b.dataset.k), a = b.dataset.a;
    if (a === 'now') f.value = ioau.currentTime.toFixed(1);
    else if (a === 'play') { ioau.currentTime = Math.max(0, (+f.value || 0) - (b.dataset.k.endsWith('_end') ? 3 : 0)); ioau.play(); }
    else f.value = Math.max(0, Math.round(((+f.value || 0) + (+a)) * 10) / 10).toFixed(1); };
  $('#iosave').onclick = async () => {
    const body = {episode_id: +$('#ioep').value};
    for (const [k] of IO_ROWS) { const v = $('#io_' + k).value; body[k] = v === '' ? null : +v; }
    for (const [a, b] of [['intro_start', 'intro_end'], ['outro_start', 'outro_end']]) {
      if ((body[a] === null) !== (body[b] === null)) { say('Fill in both the start and the end, or leave both empty.', true); return; }
      if (body[a] !== null && body[b] <= body[a]) { say('The end has to be after the start.', true); return; } }
    if (IO_ROWS.every(([k]) => body[k] === null)) { say('Mark an intro, an outro, or both.', true); return; }
    say('Saving...');
    try { const r = await post(`/api/shows/${showId}/templates`, body);
      say('Saved. ' + r.queued + ' downloaded episodes are being re-checked in the background.'); await status(); }
    catch (e) { say(readErr(e), true); } };
  const del = kind => async () => {
    if (!confirm('Delete the ' + kind + ' template? Episodes will use the fallback seconds.')) return;
    try { await api(`/api/shows/${showId}/templates/${kind}`, {method: 'DELETE'}); say('Deleted. Episodes are being re-checked.'); await status(); }
    catch (e) { say(readErr(e), true); } };
  $('#iodi').onclick = del('intro'); $('#iodo').onclick = del('outro');
  say('Pick a part of the episode that is the theme music, then press Now at the start and the end.'); await status();
  $('#iodlg').showModal();
}
$('#iodlg').addEventListener('close', () => { $('#ioau').pause(); if (ioDone) { const d = ioDone; ioDone = null; d(); } });

// ---- tag a missed ad (player) ----
const parseT = s => { s = String(s).trim(); if (!s) return NaN; const p = s.split(':').map(Number); return p.some(isNaN) ? NaN : p.reduce((a, x) => a * 60 + x, 0); };
const fmtT = s => { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = s - m * 60; return m + ':' + (x < 10 ? '0' : '') + x.toFixed(1); };
const tagSay = (m, bad) => { const el = $('#admsg'); el.textContent = m; el.className = 'msg' + (bad ? ' bad' : ''); };
let tagClock;
async function drawTags() {
  const e = queue[qi]; if (!e) return;
  $('#adranges').innerHTML = e.ads.length ? e.ads.map(r => `<div class="it"><span>${fmtT(r[0])} to ${fmtT(r[1])}</span><span>
    <button type="button" class="g" data-act="play" data-s="${r[0]}" data-t="${r[1]}">Play</button>
    <button type="button" class="g" data-act="notad" data-s="${r[0]}" data-t="${r[1]}">Not an ad</button></span></div>`).join('')
    : '<div class="msg">No ads are being skipped in this episode.</div>';
  let tags = []; try { tags = await api(`/api/episodes/${e.id}/ad-tags`); } catch (_) {}
  $('#adtags').innerHTML = tags.length ? tags.map(t => `<div class="it"><span>${t.kind === 'ad' ? 'Missed ad' : 'Not an ad'}: ${fmtT(t.start)} to ${fmtT(t.end)}</span>
    <button type="button" class="g" data-act="remove" data-id="${t.id}">Remove</button></div>`).join('') : '<div class="msg">None yet.</div>';
}
function openTagDialog() {
  const e = queue[qi]; if (!e) { alert('Play an episode first.'); return; }
  const now = au.currentTime || 0;
  $('#adstart').value = fmtT(Math.max(0, now - 30)); $('#adend').value = fmtT(now);
  tagSay('Filled in with the last 30 seconds. Adjust the times, then save.');
  const clock = () => { $('#adinfo').textContent = e.title + ' (now at ' + fmtT(au.currentTime) + ')'; };
  clock(); clearInterval(tagClock); tagClock = setInterval(clock, 500);
  drawTags(); $('#addlg').showModal();
}
$('#tagad').onclick = openTagDialog;
$('#addlg').addEventListener('close', () => clearInterval(tagClock));
$('#addlg').onclick = async ev => {
  const b = ev.target.closest('button'); const e = queue[qi]; if (!b || !e) return;
  if (b.dataset.f) {                                   // start/end field helpers
    const f = $('#' + b.dataset.f), a = b.dataset.a;
    if (a === 'now') f.value = fmtT(au.currentTime);
    else if (a === 'play') {
      const at = Math.max(0, parseT(f.value) - (b.dataset.f === 'adend' ? 5 : 0)); if (isNaN(at)) return;
      const s = parseT($('#adstart').value), t = parseT($('#adend').value);
      e._preview = [isNaN(s) ? at : s, isNaN(t) ? at + 120 : t + 1]; au.currentTime = at; au.play(); }
    else { const v = parseT(f.value); f.value = fmtT((isNaN(v) ? au.currentTime : v) + (+a)); }
    return; }
  if (b.id === 'adsave') {
    const s = parseT($('#adstart').value), t = parseT($('#adend').value);
    if (isNaN(s) || isNaN(t) || t <= s) { tagSay('Enter a start and an end, with the end after the start.', true); return; }
    b.disabled = true; tagSay('Saving...');
    try { const r = await post(`/api/episodes/${e.id}/ad-tags`, {start: s, end: t, kind: 'ad'}); e.ads = r.ads;
      tagSay('Saved. It is skipped from now on, and the server will look for this ad in your other episodes.' + (r.note ? ' ' + r.note : '')); await drawTags(); }
    catch (err) { tagSay(readErr(err), true); }
    b.disabled = false; return; }
  const s = +b.dataset.s, t = +b.dataset.t;
  if (b.dataset.act === 'play') { e._preview = [s, t + 1]; au.currentTime = Math.max(0, s - 3); au.play(); return; }
  try {
    if (b.dataset.act === 'notad') { const r = await post(`/api/episodes/${e.id}/ad-tags`, {start: s, end: t, kind: 'not_ad'}); e.ads = r.ads; tagSay('Done. That range will play from now on.'); }
    else if (b.dataset.act === 'remove') { const r = await api('/api/ad-tags/' + b.dataset.id, {method: 'DELETE'}); e.ads = r.ads; tagSay('Removed.'); }
    else return;
    await drawTags();
  } catch (err) { tagSay(readErr(err), true); }
};

window.addEventListener('pagehide', () => save(false));
render();
</script>
</body>
</html>
